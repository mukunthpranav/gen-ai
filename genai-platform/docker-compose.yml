services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
      - redis
    profiles: ["full"]

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    profiles: ["full"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["full"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    profiles: ["full"]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    profiles: ["full"]
